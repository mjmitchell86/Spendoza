name: iOS TestFlight

# Manual only: Actions > iOS TestFlight > Run workflow. Needs the owner's Apple setup and secrets;
# see docs/ios-ci-cd.md. Secrets are scoped to the steps that need them.
on:
  workflow_dispatch:

permissions:
  contents: read

# Queue, never cancel: a cancelled run can leave signing or an upload half-done.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.3'

      - name: Check required secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_APP: ${{ secrets.IOS_PROVISIONING_PROFILE_APP }}
          IOS_PROVISIONING_PROFILE_WIDGETS: ${{ secrets.IOS_PROVISIONING_PROFILE_WIDGETS }}
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT \
            IOS_DIST_CERT_P12 IOS_DIST_CERT_PASSWORD IOS_PROVISIONING_PROFILE_APP \
            IOS_PROVISIONING_PROFILE_WIDGETS PROD_SUPABASE_URL PROD_SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing. Add them under Settings > Secrets and variables > Actions (see docs/ios-ci-cd.md)."
            exit 1
          fi

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: apps/ios

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      - name: Write production Supabase config
        env:
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
        run: |
          # "//" starts an xcconfig comment, so https://host is written as https:/$()/host.
          # shellcheck disable=SC2016  # the literal $() is intended
          url=$(printf '%s' "$PROD_SUPABASE_URL" | sed 's|://|:/$()/|')
          printf 'SUPABASE_URL = %s\nSUPABASE_ANON_KEY = %s\n' "$url" "$PROD_SUPABASE_ANON_KEY" \
            > Configurations/Secrets.Prod.xcconfig

      - name: Build and upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_APP: ${{ secrets.IOS_PROVISIONING_PROFILE_APP }}
          IOS_PROVISIONING_PROFILE_WIDGETS: ${{ secrets.IOS_PROVISIONING_PROFILE_WIDGETS }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane beta
