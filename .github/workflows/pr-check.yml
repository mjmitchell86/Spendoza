name: PR Check
on: [pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      VITE_API_URL: https://test-api.spendoza.io
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - run: bun run test
